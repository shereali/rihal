services:
  # ─── MySQL 8.4 ───────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: rihal_next
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: rihal
      MYSQL_PASSWORD: rihal123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Laravel API (port 8000) ────────────────────────────────
  api:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:2fl+K3vP9qJ8sZ1nW0yX7tR4uA6bC5dE7fG8hI9jK0=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rihal_next
      DB_USERNAME: rihal
      DB_PASSWORD: rihal123
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost:8000"
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    volumes:
      - ./laravel:/var/www/html
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan migrate:fresh --seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # ─── Nuxt frontend (port 3000) ──────────────────────────────
  web:
    build:
      context: ./nuxt
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE: http://api:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./nuxt:/app
      - /app/node_modules
      - /app/.output

volumes:
  mysql_data:
