# Rihal — Nginx virtual host (production reference)
# Serves the Laravel API on :8000 via PHP-FPM and reverse-proxies the
# Nuxt 4 production server on :3000. Adjust server_name / paths per host.

server {
    listen 80;
    server_name rihal.example.com www.rihal.example.com;

    # Redirect all HTTP to HTTPS (certbot / Let's Encrypt)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rihal.example.com yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/rihal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rihal.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/rihal/laravel/public;
    index index.php;

    # Laravel API — PHP-FPM
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Uploaded tenant photos
    location /storage/ {
        alias /var/www/rihal/laravel/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Nuxt 4 production server (node .output/server/index.mjs)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 12m;

    location ~ /\.(?!well-known) {
        deny all;
    }
}
