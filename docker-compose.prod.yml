services:
  # ─── Nuxt 4 Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attashil-frontend-1
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api/v1
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3005:3000"
    networks:
      - default
      - caddy_net

  # ─── Laravel 11 API Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attashil-backend-1
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Attashil}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "https://attashil.softcredible.com"
      DB_CONNECTION: mysql
      DB_HOST: attashil-db-1
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-attashil}"
      DB_USERNAME: "${DB_USERNAME:-attashil_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@softcredible.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SANCTUM_STATEFUL_DOMAINS: "attashil.softcredible.com"
      SESSION_DOMAIN: ".softcredible.com"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-contact@softcredible.com}"
      MAIL_FROM_NAME: "${APP_NAME:-Attashil}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-bootstrap:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:8005:8000"
    networks:
      - default
      - caddy_net
    depends_on:
      db:
        condition: service_healthy

  # ─── MySQL 8 Database ─────────────────────────────────────────
  db:
    image: mysql:8
    container_name: attashil-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-attashil}"
      MYSQL_USER: "${DB_USERNAME:-attashil_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases:
          - attashil-db-1
          - attashil-db

volumes:
  backend-storage:
  backend-bootstrap:
  db-data:

networks:
  default:
    name: attashil_default
  caddy_net:
    external: true
