version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sabaaq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sabaaq_next
      MYSQL_USER: sabaaq
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sabaaq-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sabaaq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sabaaq-net

  # Laravel API (development mode — needs PHP installed locally)
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: sabaaq-laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sabaaq_next
      DB_USERNAME: sabaaq
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sabaaq-net
    command: >
      bash -c "composer install --no-interaction &&
               php artisan migrate --force &&
               php artisan serve --host=0.0.0.0 --port=8000"

  # Nuxt Frontend
  nuxt:
    build:
      context: ./nuxt
      dockerfile: Dockerfile
    container_name: sabaaq-nuxt
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./nuxt:/app
      - /app/node_modules
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://laravel:8000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - laravel
    networks:
      - sabaaq-net
    command: npm run dev

networks:
  sabaaq-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
